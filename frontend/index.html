<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darts – Scoring</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ===== OFFLINE BANNER (shown when Socket.IO disconnects) ===== -->
  <div id="offline-banner" class="offline-banner hidden" role="alert">
    ⚠ Connection lost — reconnecting…
  </div>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <h1>🎯 Darts</h1>
    <span id="connection-status" class="badge badge-offline">Offline</span>
    <a href="/" class="btn btn-secondary btn-sm" style="margin-left:auto">🏠 Home</a>
  </header>

  <!-- ===== GAME BANNER (shown when a game is active) ===== -->
  <div id="game-banner" class="game-banner hidden">
    <div id="current-player-indicator" class="current-player-indicator">
      <span id="current-player-name" class="current-player-name">–</span>
      <span id="current-player-score" class="current-player-score"></span>
    </div>
    <div class="game-banner-actions">
      <button class="btn btn-warning btn-sm" id="btn-end-turn">End Turn ➜</button>
      <button class="btn btn-secondary btn-sm" id="btn-game-undo">↩ Undo</button>
      <span id="game-code-badge" class="game-code-badge"></span>
    </div>
  </div>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="app-body">

    <!-- -------- SCORE PANEL -------- -->
    <aside class="score-panel score-panel-full">

      <div class="score-total-box">
        <div class="score-label">Total Score</div>
        <div id="total-score" class="score-total">0</div>
        <div id="dart-count" class="dart-count">0 darts</div>
      </div>

      <!-- Last dart card -->
      <div class="last-dart-box" id="last-dart-box">
        <div class="last-dart-label">Last Dart</div>
        <div id="last-dart-summary" class="last-dart-summary">–</div>
        <div id="last-dart-score" class="last-dart-score">–</div>
      </div>

      <!-- Game scoreboard (visible only when game is active) -->
      <div id="game-scoreboard-box" class="game-scoreboard-box hidden">
        <div class="history-header">
          <span>Scoreboard</span>
          <span id="game-mode-label" style="font-size:0.8rem;color:var(--text-muted,#9e9e9e)"></span>
        </div>
        <table id="scoreboard-table" class="scoreboard-table">
          <thead><tr><th>Player</th><th>Score</th><th></th></tr></thead>
          <tbody id="scoreboard-body"></tbody>
        </table>
      </div>

      <!-- Dart history list -->
      <div class="history-box">
        <div class="history-header">
          <span>Session History</span>
          <button class="btn-icon" id="btn-export-json" title="Export JSON">⬇ JSON</button>
          <button class="btn-icon" id="btn-export-csv"  title="Export CSV">⬇ CSV</button>
        </div>
        <ul id="history-list" class="history-list">
          <li class="history-empty">No darts logged yet.</li>
        </ul>
      </div>

    </aside>
  </main>

  <!-- ===== CONTROL BAR ===== -->
  <footer class="control-bar">
    <button id="btn-undo"   class="btn btn-warning"  disabled>↩ Undo</button>
    <button id="btn-clear"  class="btn btn-danger"   disabled>Clear Scores</button>
    <button id="btn-manual" class="btn btn-info">Manual Entry</button>
  </footer>

  <!-- ===== MANUAL ENTRY MODAL ===== -->
  <div id="modal-manual" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h2>Manual Dart Entry</h2>
      <div class="form-row">
        <label for="manual-number">Number (0 = Bull)</label>
        <select id="manual-number">
          <option value="0">Bull / Bullseye</option>
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option>
          <option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="10">10</option>
          <option value="11">11</option><option value="12">12</option>
          <option value="13">13</option><option value="14">14</option>
          <option value="15">15</option><option value="16">16</option>
          <option value="17">17</option><option value="18">18</option>
          <option value="19">19</option><option value="20">20</option>
        </select>
      </div>
      <div class="form-row">
        <label for="manual-zone">Zone</label>
        <select id="manual-zone">
          <option value="Single">Single</option>
          <option value="Double">Double</option>
          <option value="Treble">Treble</option>
          <option value="Bull">Bull (25)</option>
          <option value="Bullseye">Bullseye (50)</option>
        </select>
      </div>
      <div class="modal-actions">
        <button id="btn-manual-confirm" class="btn btn-success">Add</button>
        <button class="btn btn-secondary modal-close" data-modal="modal-manual">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Winner modal -->
  <div id="modal-winner" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box" style="text-align:center">
      <div style="font-size:3rem;margin-bottom:0.5rem">🏆</div>
      <h2 id="winner-title">Winner!</h2>
      <p id="winner-body"></p>
      <div class="modal-actions">
        <a class="btn btn-success" href="/setup">New Game</a>
        <a class="btn btn-secondary" href="/">Home</a>
      </div>
    </div>
  </div>

  <script src="js/socket.io.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
